name: Build and Push GitLab Offline APT Mirror

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Current Date
        id: get-date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step: Build and Save to Tar instead of pushing to Docker Hub directly
      # We build the image locally and then export it to a tar file
      - name: Build and Export Image to Tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./gitlabDockerfile
          outputs: type=docker,dest=gitlab-mirror.tar

      # Step: Split the tar file into 40MB chunks to fit Bale Bot limits
      - name: Split Image File
        run: |
          mkdir -p chunks
          split -b 20M gitlab-mirror.tar chunks/gitlab-mirror.tar.part_

      - name: Upload All Chunks to Bale
        env:
          BALE_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          MAX_RETRIES=5
          
          # Loop through ALL parts generated in this specific build
          for file in chunks/gitlab-mirror.tar.part_*; do
            attempt=1
            success=0
            
            while [ $attempt -le $MAX_RETRIES ]; do
              echo "Uploading $file (Attempt $attempt/$MAX_RETRIES)..."
              
              HTTP_STATUS=$(curl -s -w "%{http_code}" -o response.json \
                --max-time 120 \
                -X POST "https://tapi.bale.ai/bot$BALE_TOKEN/sendDocument" \
                -F "chat_id=$BALE_CHAT_ID" \
                -F "document=@$file" \
                -F "caption=Part: $(basename $file)")
                
              BODY=$(cat response.json)
              
              if [[ "$HTTP_STATUS" == "200" ]] && [[ "$BODY" == *"\"ok\":true"* ]]; then
                echo "SUCCESS: $file uploaded correctly."
                success=1
                break
              else
                echo "FAILED: Attempt $attempt for $file failed."
                echo "Waiting 5 seconds before retrying..."
                sleep 5
                attempt=$((attempt + 1))
              fi
            done
            
            if [ $success -eq 0 ]; then
              echo "FATAL ERROR: Could not upload $file after $MAX_RETRIES attempts."
              exit 1
            fi
            
            sleep 2
          done
