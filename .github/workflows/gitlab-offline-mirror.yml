name: Build and Push GitLab Offline APT Mirror

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Current Date
        id: get-date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step: Build and Save to Tar instead of pushing to Docker Hub directly
      # We build the image locally and then export it to a tar file
      - name: Build and Export Image to Tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./gitlabDockerfile
          outputs: type=docker,dest=gitlab-mirror.tar

      # Step: Configure AWS CLI for ArvanCloud
      - name: Configure AWS Credentials
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = ${{ secrets.ARVAN_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${{ secrets.ARVAN_SECRET_KEY }}" >> ~/.aws/credentials
          
      # Step: Configure AWS CLI for maximum parallelization
      - name: Configure AWS CLI for Multipart Upload
        run: |
          aws configure set default.s3.multipart_threshold 50MB
          aws configure set default.s3.multipart_chunksize 10MB
          aws configure set default.s3.max_concurrent_requests 40
          
      # Step: Upload the tar file to ArvanCloud S3
      - name: Upload to ArvanCloud S3
        run: |
          aws s3 cp gitlab-mirror.tar s3://${{ secrets.ARVAN_BUCKET_NAME }}/gitlab-mirror-${{ steps.get-date.outputs.date }}.tar \
            --endpoint-url=${{ secrets.ARVAN_ENDPOINT_URL }}
