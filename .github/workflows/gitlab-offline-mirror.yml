name: Build and Push GitLab Offline APT Mirror

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Current Date
        id: get-date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step: Build and Save to Tar instead of pushing to Docker Hub directly
      # We build the image locally and then export it to a tar file
      - name: Build and Export Image to Tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./gitlabDockerfile
          outputs: type=docker,dest=gitlab-mirror.tar

      # Step: Split the tar file into 40MB chunks to fit Bale Bot limits
      - name: Split Image File
        run: |
          mkdir -p chunks
          split -b 10M gitlab-mirror.tar chunks/gitlab-mirror.tar.part_

      #- name: Upload Only Missing Chunks to Bale
        env:
          BALE_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          # Maximum number of retries per chunk
          MAX_RETRIES=5
          
          # Array containing exactly the 24 missing parts derived from the logs
          MISSING_PARTS=(
            "gitlab-mirror.tar.part_aa" "gitlab-mirror.tar.part_ab" "gitlab-mirror.tar.part_ad" 
            "gitlab-mirror.tar.part_ae" "gitlab-mirror.tar.part_af" "gitlab-mirror.tar.part_ag" 
            "gitlab-mirror.tar.part_ah" "gitlab-mirror.tar.part_ai" "gitlab-mirror.tar.part_aj" 
            "gitlab-mirror.tar.part_ak" "gitlab-mirror.tar.part_al" "gitlab-mirror.tar.part_am" 
            "gitlab-mirror.tar.part_an" "gitlab-mirror.tar.part_ap" "gitlab-mirror.tar.part_bd" 
            "gitlab-mirror.tar.part_bi" "gitlab-mirror.tar.part_bk" "gitlab-mirror.tar.part_bl" 
            "gitlab-mirror.tar.part_bm" "gitlab-mirror.tar.part_bn" "gitlab-mirror.tar.part_cs" 
            "gitlab-mirror.tar.part_dr" "gitlab-mirror.tar.part_dt" "gitlab-mirror.tar.part_dy"
          )
          
          for part_name in "${MISSING_PARTS[@]}"; do
            file="chunks/$part_name"
            
            # Check if the generated chunk actually exists
            if [ ! -f "$file" ]; then
              echo "WARNING: File $file does not exist! Skipping."
              continue
            fi
            
            attempt=1
            success=0
            
            # Smart retry loop to handle Bale 504 and 500 errors
            while [ $attempt -le $MAX_RETRIES ]; do
              echo "Uploading $file (Attempt $attempt/$MAX_RETRIES)..."
              
              HTTP_STATUS=$(curl -s -w "%{http_code}" -o response.json \
                --max-time 120 \
                -X POST "https://tapi.bale.ai/bot$BALE_TOKEN/sendDocument" \
                -F "chat_id=$BALE_CHAT_ID" \
                -F "document=@$file" \
                -F "caption=Part: $(basename $file)")
                
              BODY=$(cat response.json)
              
              # Validate both HTTP status 200 and Bale's internal success flag
              if [[ "$HTTP_STATUS" == "200" ]] && [[ "$BODY" == *"\"ok\":true"* ]]; then
                echo "SUCCESS: $file uploaded correctly."
                success=1
                break
              else
                echo "FAILED: Attempt $attempt for $file failed."
                echo "Waiting 5 seconds before retrying..."
                sleep 5
                attempt=$((attempt + 1))
              fi
            done
            
            # Abort workflow if a part critically fails 5 times
            if [ $success -eq 0 ]; then
              echo "FATAL ERROR: Could not upload $file after $MAX_RETRIES attempts."
              exit 1
            fi
            
            # Respect API limits between chunks
            sleep 2
          done
          
          echo "All 24 missing parts have been uploaded successfully!"
