name: Build and Push GitLab Offline APT Mirror

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Current Date
        id: get-date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step: Build and Save to Tar instead of pushing to Docker Hub directly
      # We build the image locally and then export it to a tar file
      - name: Build and Export Image to Tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./gitlabDockerfile
          outputs: type=docker,dest=gitlab-mirror.tar

      # Step: Split the tar file into 40MB chunks to fit Bale Bot limits
      - name: Split Image File
        run: |
          mkdir -p chunks
          split -b 10M gitlab-mirror.tar chunks/gitlab-mirror.tar.part_

      # Step: Upload all chunks sequentially to Bale Messenger via Bot API
      - name: Send Chunks to Bale Messenger
        env:
          BALE_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          # Loop through all generated parts and upload them one by one
          for file in chunks/gitlab-mirror.tar.part_*; do
            echo "Uploading $file to Bale..."
            
            curl -X POST "https://tapi.bale.ai/bot$BALE_TOKEN/sendDocument" \
              -F "chat_id=$BALE_CHAT_ID" \
              -F "document=@$file" \
              -F "caption=Part: $(basename $file)"
              
            # Add a small delay (2 seconds) between uploads to prevent rate-limiting
            sleep 2
          done

      # Step: Configure AWS CLI for ArvanCloud
      - name: Configure AWS Credentials
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = ${{ secrets.ARVAN_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${{ secrets.ARVAN_SECRET_KEY }}" >> ~/.aws/credentials
          
      # Step: Configure AWS CLI for maximum parallelization
      - name: Configure AWS CLI for Multipart Upload
        run: |
          aws configure set default.s3.multipart_threshold 50MB
          aws configure set default.s3.multipart_chunksize 10MB
          aws configure set default.s3.max_concurrent_requests 40
          
      # Step: Upload the tar file to ArvanCloud S3
      - name: Upload to ArvanCloud S3
        run: |
          aws s3 cp gitlab-mirror.tar s3://${{ secrets.ARVAN_BUCKET_NAME }}/gitlab-mirror-${{ steps.get-date.outputs.date }}.tar \
            --endpoint-url=${{ secrets.ARVAN_ENDPOINT_URL }}
