- name: Commit and Push Chunks to GitHub in Batches
        run: |
          # Configure Git user for the automated commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create an orphan branch named 'mirror-chunks' to prevent repo bloat
          git checkout --orphan mirror-chunks || git checkout mirror-chunks
          
          # Remove old tracked files from the workspace
          git rm -rf . || true
          
          # Move chunks to the current directory
          cp -r image-chunks/* ./
          
          # Batch push variables
          BATCH_SIZE=5
          COUNTER=0
          IS_FIRST_PUSH=true
          
          # Loop through chunks and commit them in smaller batches to avoid GitHub timeouts
          for file in gitlab-mirror.tar.part_*; do
            git add "$file"
            COUNTER=$((COUNTER + 1))
            
            # When the batch size is reached, commit and push
            if [ $COUNTER -eq $BATCH_SIZE ]; then
              git commit -m "chore: add chunk batch [skip ci]"
              
              if [ "$IS_FIRST_PUSH" = true ]; then
                echo "Force pushing first batch..."
                git push -f origin mirror-chunks
                IS_FIRST_PUSH=false
              else
                echo "Pushing next batch..."
                git push origin mirror-chunks
              fi
              
              # Reset counter for the next batch
              COUNTER=0
            fi
          done
          
          # Commit and push any remaining files that didn't fill the last batch
          if [ $COUNTER -gt 0 ]; then
            git commit -m "chore: add remaining chunks [skip ci]"
            if [ "$IS_FIRST_PUSH" = true ]; then
              git push -f origin mirror-chunks
            else
              git push origin mirror-chunks
            fi
          fi
          
          echo "All chunks have been pushed to GitHub successfully!"
